[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.13.0",
    "asyncpg>=0.32.0",
    "pyarrow>=23.0.1",
    "cryptography>=50.0.2",
    "faiss-cpu==1.15.1",
    "fastapi>=0.143.0",
    "fastmcp>=3.4.10",
    "google-cloud-storage>=3.17.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "langchain>=1.4.7",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-community[vertexaisearch]>=5.1.1",
    "langchain-google-genai>=4.4.1",
    "langchain-google-vertexai>=3.2.4",
    "langchain-huggingface>=1.2.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint>=4.2.0",
    "langsmith>=0.14.7",
    "markdown==3.11",
    "myst-parser==5.1.0",
    "nest-asyncio>=1.6.0",
"openai==3.29.0",
    "protobuf>=5.29.6",
    "PyJWT>=2.13.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pygments>=2.21.0",
    "pypdf==6.21.2",
    "rank-bm25==0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
    "sphinx==9.1.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-book-theme==1.4.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-external-toc==1.1.0",
    "sphinxcontrib-mermaid==2.1.1",
    "sqlalchemy>=2.1.4",
    "starlette>=1.7.0",
    "tenacity>=9.1.4",
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.19",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.6.1",
    "ruff==0.17.0",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-markdown==3.10.2.20261007",
    "types-requests==2.33.0.20261006",
    "types-tqdm==4.70.0.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, may require external resources)",
]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = "nest_asyncio"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_google_community.*"
ignore_missing_imports = true

[tool.mypy]
exclude = [
    "^tests/",
]
python_version = "3.13"
disallow_untyped_defs = true

[tool.ruff.lint]
# Ruff's historical default rule set. Newer ruff releases widen the default
# selection; keep lint results stable across ruff upgrades.
select = ["E4", "E7", "E9", "F"]
