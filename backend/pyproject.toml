[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "pyarrow>=23.0.1",
    "cryptography>=50.0.1",
    "faiss-cpu==1.15.0",
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "google-cloud-storage>=3.13.1",
    "httpx>=0.28.1",
    "huggingface-hub>=1.29.0",
    "langchain>=1.3.18",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-google-vertexai>=3.2.4",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint>=4.2.0",
    "langsmith>=0.11.2",
    "markdown==3.10.3",
    "myst-parser==5.1.0",
    "nest-asyncio>=1.6.0",
"openai==3.6.0",
    "protobuf>=5.29.6",
    "PyJWT>=2.13.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "pygments>=2.21.0",
    "pypdf==6.16.2",
    "rank-bm25==0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.1",
    "transformers>=5.16.1",
    "sphinx==9.1.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-book-theme==1.4.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-external-toc==1.1.0",
    "sphinxcontrib-mermaid==2.1.0",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "tenacity>=9.1.4",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit==4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-xdist>=3.6.1",
    "ruff==0.16.5",
    "types-beautifulsoup4==4.12.0.20250516",
    "types-markdown==3.10.2.20260712",
    "types-requests==2.33.0.20260712",
    "types-tqdm==4.70.0.20260827",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, may require external resources)",
]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = "nest_asyncio"
ignore_missing_imports = true

[tool.mypy]
exclude = [
    "^tests/",
]
python_version = "3.13"
disallow_untyped_defs = true
