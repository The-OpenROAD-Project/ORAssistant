version: 2

# Batch routine updates for weekly review.
# Security updates remain alert-driven and outside these groups.
# A high version-update limit prevents the default five-PR bottleneck.
updates:
  - package-ecosystem: uv
    directories:
      - /backend
      - /frontend
      - /frontend/mock-flask-api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1000
    cooldown:
      default-days: 7
    groups:
      quality-tools:
        applies-to: version-updates
        patterns:
          - "ruff"
          - "mypy"
          - "pre-commit"
          - "pytest"
          - "pytest-*"
          - "types-*"
        update-types:
          - patch
      python-runtime:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "mypy"
          - "pre-commit"
          - "pytest"
          - "pytest-*"
          - "types-*"
        update-types:
          - minor
          - patch
  # Evaluation has compatibility bounds that do not apply to the backend.
  - package-ecosystem: uv
    directory: /evaluation
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1000
    cooldown:
      default-days: 7
    groups:
      quality-tools:
        applies-to: version-updates
        patterns:
          - "ruff"
          - "mypy"
          - "pre-commit"
          - "pytest"
          - "pytest-*"
          - "types-*"
        update-types:
          - patch
      python-runtime:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "ruff"
          - "mypy"
          - "pre-commit"
          - "pytest"
          - "pytest-*"
          - "types-*"
        update-types:
          - minor
          - patch
    # Remove these ignores when the matching evaluation/pyproject.toml
    # constraints are migrated. Other major upgrades remain individual PRs.
    ignore:
      - dependency-name: instructor
        # Instructor 1.13.0 and later require OpenAI >=2; evaluation pins 1.x.
        versions: [">=1.13.0"]
      - dependency-name: openai
        versions: [">=2"]  # Evaluation pins openai to 1.x.
      - dependency-name: google-cloud-aiplatform
        versions: [">=2"]  # Evaluation requires google-cloud-aiplatform <2.
      - dependency-name: protobuf
        versions: [">=7"]  # Evaluation requires protobuf <7; 6.x is allowed.

  - package-ecosystem: npm
    directory: /frontend/nextjs-frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1000
    cooldown:
      default-days: 7
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Remove these ignores when eslint-config-next's plugins support eslint 10
    # and typescript-eslint supports the newer typescript.
    ignore:
      - dependency-name: eslint
        # eslint-plugin-import, -react and -jsx-a11y accept eslint ^9 only.
        versions: [">=10"]
      - dependency-name: typescript
        # typescript-eslint requires typescript <6.1.0.
        versions: [">=6.1"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /common
      - /frontend
      - /frontend/nextjs-frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1000
    cooldown:
      default-days: 7
    groups:
      images:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1000
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
