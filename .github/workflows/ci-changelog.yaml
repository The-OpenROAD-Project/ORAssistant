name: Release Changelog

# Build CHANGELOG.md from the history up to the release tag and attach it to
# the release as an asset. The job does not commit or push, so it needs no
# branch write access and no personal token.
on:
  release:
    types: [published]

jobs:
  changelog:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Create Changelog file
        run: |
          make changelog

      - name: Attach Changelog to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" CHANGELOG.md --clobber --repo "$GITHUB_REPOSITORY"
