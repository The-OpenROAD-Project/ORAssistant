name: ORAssistant CI
run-name: ${{ github.actor }} started CI

on:
  pull_request:

# The jobs only read the code. Without this block, the token gets the
# repository default, which can write.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint-backend:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd backend && make init-dev

    - name: Lint
      run: cd backend && make check

  lint-frontend:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd frontend && make init-dev

    - name: Lint
      run: cd frontend && make check

  lint-nextjs:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '26'

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Same Corepack and Yarn setup as frontend/nextjs-frontend/Dockerfile.
    - name: Install deps
      working-directory: frontend/nextjs-frontend
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        npm install -g corepack@0.36.0
        corepack enable
        yarn install --immutable

    - name: Lint
      working-directory: frontend/nextjs-frontend
      run: yarn lint

    - name: Check formatting
      working-directory: frontend/nextjs-frontend
      run: yarn format-check

  lint-evaluation:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd evaluation && make init-dev

    - name: Lint
      run: cd evaluation && make check

  test:
    needs: [lint-backend]
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd backend && make init-dev

    - name: Run unit tests
      env:
        # Some tests import the API, which needs application default
        # credentials. The tests make no API calls, so a fake file is enough.
        GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/fake-adc.json
        GOOGLE_CLOUD_PROJECT: unit-test
      working-directory: backend
      run: |
        cp .env.test .env
        echo '{"type": "authorized_user", "client_id": "x", "client_secret": "x", "refresh_token": "x"}' > "$GOOGLE_APPLICATION_CREDENTIALS"
        make test

  docker-build:
    needs: [test, lint-frontend, lint-evaluation]
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Build Docker images
      run: docker compose build --parallel

  ci-gate:
    if: always()
    needs: [lint-backend, lint-frontend, lint-nextjs, lint-evaluation, test, docker-build]
    runs-on: ubuntu-26.04
    steps:
    - name: Require successful CI jobs
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        echo "$NEEDS_JSON"
        jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
