name: ORAssistant CI
run-name: ${{ github.actor }} started CI

on:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  lint-backend:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd backend && make init-dev

    - name: Lint
      run: cd backend && make check

  lint-frontend:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd frontend && make init-dev

    - name: Lint
      run: cd frontend && make check

  lint-nextjs:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '26'

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    # Same Corepack and Yarn setup as frontend/nextjs-frontend/Dockerfile.
    - name: Install deps
      working-directory: frontend/nextjs-frontend
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        npm install -g corepack@0.36.0
        corepack enable
        yarn install --immutable

    - name: Lint
      working-directory: frontend/nextjs-frontend
      run: yarn lint

  lint-evaluation:
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd evaluation && make init-dev

    - name: Lint
      run: cd evaluation && make check

  test:
    needs: [lint-backend]
    runs-on: self-hosted-ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Install deps
      run: cd backend && make init-dev

    - name: Run unit tests
      env:
        # Auto detection sees the shared host's CPUs instead of the slot quota.
        PYTEST_XDIST_AUTO_NUM_WORKERS: '8'
      working-directory: backend
      run: |
        cp .env.test .env
        make test

  docker-build:
    needs: [test, lint-frontend, lint-evaluation]
    runs-on: self-hosted-ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Build Docker images
      run: docker compose build --parallel

  ci-gate:
    if: always()
    needs: [lint-backend, lint-frontend, lint-nextjs, lint-evaluation, test, docker-build]
    runs-on: ubuntu-26.04
    steps:
    - name: Require successful CI jobs
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        echo "$NEEDS_JSON"
        jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"
