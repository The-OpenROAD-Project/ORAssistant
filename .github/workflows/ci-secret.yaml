name: ORAssistant Secret CI
# Quoted: an unquoted ' #' would start a YAML comment.
run-name: "${{ github.actor }} started CI${{ inputs.pr && format(' for PR #{0}', inputs.pr) || '' }}"

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'evaluation/**'
      - 'Makefile'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      # A documentation change cannot change the evaluation score. The
      # exclusion must come last: the last matching pattern wins.
      - '!**/*.md'
      # Workflow tests do not change answers or evaluation inputs.
      - '!backend/tests/test_ci_secret_workflow.py'
  workflow_dispatch:
    inputs:
      pr:
        description: Open pull request number to test instead of the selected branch
        required: false
        type: string
        default: ''
      # Empty judge, limit, and cases run every case with the default judge,
      # as a push run does. The baseline gate skips a run whose case count
      # differs from the baseline, so limit=100 or all 100 cases still gates.
      judge:
        description: Judge model id instead of the default JUDGE_MODEL, at most 64 characters
        required: false
        type: string
        default: ''
      limit:
        description: Evaluate only the first N questions, N from 1-100
        required: false
        type: string
        default: ''
      cases:
        description: Evaluate only these 0-based question indexes from 0-99, for example 20,84 (not with limit)
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  # Pick the code under test: the pushed commit, or a pull request's merge result.
  # Only people with write access can dispatch this workflow, so the secrets stay
  # with reviewed code.
  resolve:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      pr: ${{ steps.target.outputs.pr }}
      head_sha: ${{ steps.target.outputs.head_sha }}
      eval_args: ${{ steps.eval_args.outputs.eval_args }}
      status_context: ${{ steps.eval_args.outputs.status_context }}
      status_label: ${{ steps.eval_args.outputs.status_label }}
    steps:
    # Every other job needs this one, so a bad input stops the run before any
    # paid or self-hosted step. The values reach a shell in the eval job.
    - name: Check the eval inputs
      id: eval_args
      env:
        JUDGE: ${{ inputs.judge }}
        LIMIT: ${{ inputs.limit }}
        CASES: ${{ inputs.cases }}
      run: |
        check() {
          # Do not print the value: it could hold a workflow command.
          if [ -n "$2" ] && ! [[ "$2" =~ $3 ]]; then
            echo "::error::The $1 input does not match $3"
            exit 1
          fi
        }
        # At most 64 characters, so the status description has room for it.
        check judge "$JUDGE" '^[a-z0-9][a-z0-9.-]{0,63}$'
        # The eval dataset has 100 questions, so limit is 1-100 and each case
        # is 0-99. When the dataset size changes, change these patterns and
        # the input descriptions.
        check limit "$LIMIT" '^([1-9][0-9]?|100)$'
        check cases "$CASES" '^[0-9]{1,2}(,[0-9]{1,2})*$'
        if [ -n "$LIMIT" ] && [ -n "$CASES" ]; then
          echo "::error::Set limit or cases, not both"
          exit 1
        fi
        # eval_main.py runs each index once, so a repeated index (7 and 07
        # too) would make the case count in the status wrong.
        indexes=()
        if [ -n "$CASES" ]; then IFS=, read -ra indexes <<< "$CASES"; fi
        declare -A seen=()
        for index in "${indexes[@]}"; do
          index=$((10#$index))
          if [ -n "${seen[$index]:-}" ]; then
            echo "::error::The cases input repeats an index"
            exit 1
          fi
          seen[$index]=1
        done
        args=()
        overrides=()
        if [ -n "$JUDGE" ]; then args+=(--judge "$JUDGE"); overrides+=("judge $JUDGE"); fi
        if [ -n "$LIMIT" ]; then args+=(--limit "$LIMIT"); overrides+=("limit $LIMIT"); fi
        if [ -n "$CASES" ]; then
          args+=(--cases "$CASES")
          # GitHub rejects a status description over 140 characters. The
          # longest label, "judge <64 characters>, cases <40 characters>",
          # plus " running" fits. A longer case list shows as a count.
          if [ ${#CASES} -le 40 ]; then
            overrides+=("cases $CASES")
          else
            overrides+=("${#indexes[@]} cases")
          fi
        fi
        # A PR run with an input reports on its own status context. So the
        # "Secret CI" status comes only from a full run with the default judge.
        if [ ${#overrides[@]} -eq 0 ]; then
          context="Secret CI"
          label="Full suite"
        else
          context="Secret CI (custom)"
          label=$(printf '%s, ' "${overrides[@]}")
          label=${label%, }
        fi
        {
          echo "eval_args=${args[*]}"
          echo "status_context=$context"
          echo "status_label=$label"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve the code under test
      id: target
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        STATUS_CONTEXT: ${{ steps.eval_args.outputs.status_context }}
        STATUS_LABEL: ${{ steps.eval_args.outputs.status_label }}
      run: |
        if [ -z "$PR" ]; then
          echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "pr=" >> "$GITHUB_OUTPUT"
          echo "head_sha=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # GitHub computes mergeability lazily; the first answer can be null.
        for attempt in 1 2 3 4 5 6; do
          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          mergeable=$(jq -r '.mergeable' <<< "$pr_json")
          [ "$mergeable" != "null" ] && break
          sleep 5
        done
        state=$(jq -r '.state' <<< "$pr_json")
        head_sha=$(jq -r '.head.sha' <<< "$pr_json")
        if [ "$state" != "open" ]; then
          echo "::error::PR #$PR is $state, not open"
          exit 1
        fi
        if [ "$mergeable" != "true" ]; then
          echo "::error::PR #$PR is not mergeable (mergeable=$mergeable); update it first"
          exit 1
        fi
        gh api "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
          -f state=pending -f context="$STATUS_CONTEXT" \
          -f target_url="$RUN_URL" -f description="$STATUS_LABEL running"
        echo "ref=refs/pull/$PR/merge" >> "$GITHUB_OUTPUT"
        echo "pr=$PR" >> "$GITHUB_OUTPUT"
        echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  lint-backend:
    needs: [resolve]
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.resolve.outputs.ref }}
    - name: Install deps
      run: cd backend && make init-dev
    - name: Lint
      run: cd backend && make check

  lint-frontend:
    needs: [resolve]
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.resolve.outputs.ref }}
    - name: Install deps
      run: cd frontend && make init-dev
    - name: Lint
      run: cd frontend && make check

  lint-nextjs:
    needs: [resolve]
    runs-on: ubuntu-26.04
    steps:
    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '26'

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.resolve.outputs.ref }}

    # Same Corepack and Yarn setup as the PR workflow and frontend Dockerfile.
    - name: Install deps
      working-directory: frontend/nextjs-frontend
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: |
        npm install -g corepack@0.36.0
        corepack enable
        yarn install --immutable

    - name: Lint
      working-directory: frontend/nextjs-frontend
      run: yarn lint

    - name: Check formatting
      working-directory: frontend/nextjs-frontend
      run: yarn format-check

  lint-evaluation:
    needs: [resolve]
    runs-on: ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.resolve.outputs.ref }}
    - name: Install deps
      run: cd evaluation && make init-dev
    - name: Lint
      run: cd evaluation && make check

  test:
    needs: [resolve, lint-backend]
    runs-on: self-hosted-ubuntu-26.04
    steps:
    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.resolve.outputs.ref }}
    - name: Install deps
      run: cd backend && make init-dev
    - name: Run unit tests
      env:
        # Auto detection sees the shared host's CPUs instead of the slot quota.
        PYTEST_XDIST_AUTO_NUM_WORKERS: '8'
      working-directory: backend
      run: |
        cp .env.test .env
        make test

  docker-eval:
    needs: [resolve, test, lint-frontend, lint-nextjs, lint-evaluation]
    runs-on: self-hosted-ubuntu-26.04-eval
    # Each eval is paid and holds a self-hosted runner. Run one at a time per
    # target (a PR number, or the branch). A started eval finishes; a newer
    # eval replaces the one that waits.
    # A custom run (judge, limit, or cases set) has its own queue per target,
    # so it never cancels a waiting full run, for example a master push eval.
    # Its marker comes before "eval-", where no ref can add it. The cost: a
    # custom eval can run beside a full eval of the same target.
    concurrency:
      group: ${{ github.workflow }}-${{ (inputs.judge || inputs.limit || inputs.cases) && 'custom-' || '' }}eval-${{ inputs.pr && format('pr-{0}', inputs.pr) || github.ref }}
      cancel-in-progress: false
    env:
      # The RAG corpus commit on Hugging Face. To use a new corpus, set this to
      # the commit in the job summary of a successful upload.yml run. Do not
      # use a failed run: the upload can commit in several parts, so the
      # branch can hold only part of the corpus.
      HF_RAG_REVISION: 0cc9586013d96a8e158e83dd6608e9597d4e4883
    # contents: write covers both actions/checkout (read) and the commit-comment
    # step below (write); no other step in this job needs a token permission.
    permissions:
      contents: write
    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.resolve.outputs.ref }}

    - name: Download HF dataset
      run: |
        : "${HF_RAG_REVISION:?HF_RAG_REVISION is not set}"
        # actions/checkout cleans the workspace, so ./data is new on each run.
        uv tool install huggingface-hub
        hf download The-OpenROAD-Project/ORAssistant_RAG_Dataset \
          --repo-type dataset --revision "$HF_RAG_REVISION" --local-dir ./data

    - name: Populate environment variables
      run: |
        cp backend/.env.example backend/.env
        sed -i 's|{{GOOGLE_API_KEY}}|${{ secrets.GOOGLE_API_KEY }}|g' backend/.env
        sed -i 's|{{GOOGLE_PROJECT_ID}}|${{ secrets.GOOGLE_PROJECT_ID }}|g' backend/.env
        sed -i 's|{{PATH_TO_GOOGLE_APPLICATION_CREDENTIALS}}|src/secret.json|g' backend/.env
        sed -i 's|HF_TOKEN=|HF_TOKEN=${{ secrets.HF_TOKEN }}|g' backend/.env

        cp backend/.env.example evaluation/.env
        sed -i 's|{{GOOGLE_API_KEY}}|${{ secrets.GOOGLE_API_KEY }}|g' evaluation/.env
        sed -i 's|{{GOOGLE_PROJECT_ID}}|${{ secrets.GOOGLE_PROJECT_ID }}|g' evaluation/.env
        sed -i 's|{{PATH_TO_GOOGLE_APPLICATION_CREDENTIALS}}|src/secret.json|g' evaluation/.env
        sed -i 's|HF_TOKEN=|HF_TOKEN=${{ secrets.HF_TOKEN }}|g' evaluation/.env

    - name: Copy Google credentials
      env:
        GOOGLE_SECRET_JSON: ${{ secrets.PATH_TO_GOOGLE_APPLICATION_CREDENTIALS }}
      run: |
        make seed-credentials

    - name: Build and start Docker stack
      run: |
        make docker-up-ci

    - name: Wait for graph readiness
      run: |
        echo "Waiting for graph to finish initializing..."
        for i in $(seq 1 360); do
          status=$(curl -sf http://localhost:8000/conversations/ready || true)
          if grep -q '"ready"' <<< "$status"; then
            echo "Graph is ready"
            exit 0
          fi
          # A failed start never becomes ready; stop now instead of in an hour.
          if grep -q '"failed"' <<< "$status"; then
            echo "Graph initialization failed: $status"
            exit 1
          fi
          echo "Waiting for graph initialization... ($i/360)"
          sleep 10
        done
        echo "Graph did not become ready after 60 minutes"
        exit 1

    - name: Run LLM CI
      id: llm_tests
      working-directory: evaluation
      env:
        # Checked in the resolve job. Empty for a full run.
        EVAL_ARGS: ${{ needs.resolve.outputs.eval_args }}
      run: |
        make llm-tests EVAL_ARGS="$EVAL_ARGS"

    - name: Capture Docker logs on failure
      if: failure()
      run: |
        mkdir -p docker-logs
        echo "=== Docker Container Status ==="
        docker ps -a
        echo ""
        echo "=== COMPLETE BACKEND LOGS ==="
        docker logs backend 2>&1 || echo "Failed to get backend logs"
        echo ""
        echo "=== COMPLETE FRONTEND LOGS ==="
        docker logs frontend 2>&1 || echo "Failed to get frontend logs"
        echo ""
        echo "=== COMPLETE POSTGRES LOGS ==="
        docker logs postgres 2>&1 || echo "Failed to get postgres logs"

        docker logs backend > docker-logs/backend.log 2>&1 || echo "Failed to capture backend logs"
        docker logs frontend > docker-logs/frontend.log 2>&1 || echo "Failed to capture frontend logs"
        docker logs postgres > docker-logs/postgres.log 2>&1 || echo "Failed to capture postgres logs"

    - name: Upload Docker logs as artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: docker-logs-${{ github.run_id }}
        path: docker-logs/
        retention-days: 7

    # Comments get the run metadata and the aggregate metrics.
    - name: Summarize evaluation output
      if: always()
      working-directory: evaluation/auto_evaluation
      run: |
        ./summarize_output.sh llm_tests_output.txt llm_tests_summary.md

    - name: Upload evaluation output as artifact
      if: failure() || needs.resolve.outputs.pr != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: evaluation-output-${{ github.run_id }}
        path: |
          evaluation/auto_evaluation/llm_tests_output.txt
          evaluation/auto_evaluation/llm_tests_summary.md
          evaluation/auto_evaluation/eval_results.json
        retention-days: 7
        if-no-files-found: ignore

    # A later run reads the last master results file as its regression
    # baseline. See evaluation/auto_evaluation/run_results.py for the schema.
    - name: Upload evaluation results
      if: always() && needs.resolve.outputs.pr == ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: eval-results-${{ github.run_id }}
        path: evaluation/auto_evaluation/eval_results.json
        retention-days: 90

    # Post on failure too, so a run that the retrieval check stops stays visible.
    - name: Create commit comment
      if: always() && needs.resolve.outputs.pr == '' && hashFiles('evaluation/auto_evaluation/llm_tests_summary.md') != ''
      uses: peter-evans/commit-comment@f6d60c65d05bb59f750fa51ad3de1d443ba0eb52  # v4.0.0
      with:
        token: ${{ github.token }}
        body-path: evaluation/auto_evaluation/llm_tests_summary.md

    - name: Teardown
      if: always()
      run: |
        make docker-down-ci

  # Compare the scores with the newest completed master run. A run that fails
  # this gate is still the baseline for the next run, so one drop fails one
  # run and does not block master. This job runs on a GitHub-hosted runner,
  # which has the gh CLI, and does not hold a self-hosted runner.
  baseline-gate:
    if: always() && needs.docker-eval.result == 'success'
    needs: [resolve, docker-eval]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        ref: ${{ needs.resolve.outputs.ref }}

    # Master runs store the results as eval-results-<run id>; PR runs keep
    # them in the evaluation output, so a PR run is never a baseline.
    - name: Download the results of this run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: ${{ needs.resolve.outputs.pr == '' && format('eval-results-{0}', github.run_id) || format('evaluation-output-{0}', github.run_id) }}
        path: current

    - name: Find the baseline
      id: baseline
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.run_id }}
      run: |
        # Newest first. The API lists only runs that finished, whatever their
        # conclusion; this run is still in progress, but skip it anyway.
        gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-secret.yaml/runs?branch=master&event=push&status=completed&per_page=30" \
          --jq '.workflow_runs[].id' > runs.txt
        while read -r id; do
          [ "$id" = "$RUN_ID" ] && continue
          rm -rf baseline
          # The artifact is missing when the run failed early or expired.
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n "eval-results-$id" -D baseline 2>/dev/null || continue
          # A file that does not parse is no baseline; try the next run.
          status=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["status"])' baseline/eval_results.json) || continue
          if [ "$status" = completed ]; then
            echo "Baseline: run $id"
            echo "run_id=$id" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done < runs.txt
        rm -rf baseline
        echo "No completed master run with a results file."

    - name: Compare with the baseline
      env:
        BASELINE_RUN: ${{ steps.baseline.outputs.run_id }}
      run: |
        args=(--current current/eval_results.json)
        if [ -n "$BASELINE_RUN" ]; then
          args+=(--baseline baseline/eval_results.json)
          echo "Baseline run: $BASELINE_RUN" > gate.txt
        fi
        status=0
        python3 evaluation/auto_evaluation/baseline_gate.py "${args[@]}" >> gate.txt || status=$?
        cat gate.txt
        { echo '```text'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

  # Report a pull request run on the PR. This runs on a GitHub-hosted runner,
  # which has the gh CLI, and after every other job, so an early failure is
  # reported too.
  report:
    if: always() && needs.resolve.outputs.pr != ''
    needs: [resolve, lint-backend, lint-frontend, lint-nextjs, lint-evaluation, test, docker-eval, baseline-gate]
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    steps:
    - name: Download evaluation output
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: evaluation-output-${{ github.run_id }}
        path: evaluation-output

    - name: Report the result on the pull request
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS_JSON: ${{ toJSON(needs) }}
        PR: ${{ needs.resolve.outputs.pr }}
        HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # "Secret CI (custom)" for a run with an eval input, as in resolve.
        STATUS_CONTEXT: ${{ needs.resolve.outputs.status_context }}
        STATUS_LABEL: ${{ needs.resolve.outputs.status_label }}
      run: |
        if jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON" > /dev/null; then
          state=success
        else
          state=failure
        fi
        gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
          -f state="$state" -f context="$STATUS_CONTEXT" \
          -f target_url="$RUN_URL" -f description="$STATUS_LABEL $state"
        summary=evaluation-output/llm_tests_summary.md
        if [ -s "$summary" ]; then
          { echo "$STATUS_CONTEXT $state: $RUN_URL"; echo; cat "$summary"; } > comment.md
        else
          echo "$STATUS_CONTEXT $state with no evaluation output: $RUN_URL" > comment.md
        fi
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
